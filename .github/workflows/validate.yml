name: Offline patch script validation

on:
  push:
    branches:
      - feature/patch-framework-enhancements
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n offline_patch.sh
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck --severity=warning offline_patch.sh

  rocky-9-parser-check:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
    steps:
      - name: Install parser tools
        run: |
          dnf -y install bash diffutils findutils grep sed gawk
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate script under Rocky Linux 9
        run: bash -n offline_patch.sh
      - name: Smoke-test command prerequisites and help output
        shell: bash
        run: |
          set +e
          bash ./offline_patch.sh > smoke-test.out 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 1 ]]; then
            cat smoke-test.out
            echo "Expected help path to exit with status 1; got $rc"
            exit 1
          fi
          grep -q "Offline Patch Management Script" smoke-test.out
          grep -q "Rocky Linux, RHEL, AlmaLinux and Oracle Linux 8 and 9" smoke-test.out
          echo "PASS: prerequisite checks and help path executed on Rocky Linux 9."
